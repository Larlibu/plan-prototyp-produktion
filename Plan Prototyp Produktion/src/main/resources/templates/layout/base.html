<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Plan Prototyp Produktion</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="alternate" type="application/rss+xml"  title="Plan Prototyp Produktion – RSS"  href="/feed/rss">
    <link rel="alternate" type="application/atom+xml" title="Plan Prototyp Produktion – Atom" href="/feed/atom">
    <!-- HTMX from CDN for simplicity, could be served locally via webjar -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div th:replace="${content}"></div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="/js/script.js"></script>
</body>
</html>
