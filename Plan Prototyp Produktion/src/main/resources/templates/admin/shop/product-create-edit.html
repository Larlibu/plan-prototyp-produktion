<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Produkt bearbeiten' : 'Neues Produkt erstellen'"></title>
</head>
<body>
    <div th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
        <main>
            <section class="admin-form">
                <div class="container">
                    <h1 th:text="${isEdit} ? 'Produkt bearbeiten' : 'Neues Produkt erstellen'"></h1>

                    <form th:action="${isEdit} ? @{/admin/shop/edit/{id}(id=${product.id})} : @{/admin/shop/create}"
                          th:object="${product}"
                          method="post" enctype="multipart/form-data" class="form-card">

                        <input type="hidden" th:if="${isEdit}" th:field="*{id}">
                        <!-- Hidden field to retain existing image if not removed and no new image uploaded -->
                        <input type="hidden" th:field="*{existingImage}" th:if="${isEdit and product.existingImage != null}">


                        <div class="form-group">
                            <label for="name">Name:</label>
                            <input type="text" id="name" th:field="*{name}" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="form-group">
                            <label for="description">Beschreibung:</label>
                            <textarea id="description" th:field="*{description}" th:errorclass="is-invalid" rows="5"></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                        </div>

                        <div class="form-group">
                            <label for="price">Preis:</label>
                            <input type="number" id="price" th:field="*{price}" th:errorclass="is-invalid" step="0.01">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                        </div>

                        <div class="form-group">
                            <label for="stock">Lagerbestand:</label>
                            <input type="number" id="stock" th:field="*{stock}" th:errorclass="is-invalid" min="0">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
                        </div>

                        <div class="form-group">
                            <label for="imageFile">Bild:</label>
                            <input type="file" id="imageFile" name="imageFile" accept="image/*">
                            <div th:if="${isEdit and product.existingImage != null}" class="current-image">
                                <p>Aktuelles Bild:</p>
                                <img th:src="@{'data:image/jpeg;base64,' + ${product.existingImage}}" alt="Aktuelles Bild" style="max-width: 200px; height: auto;">
                                <div class="form-check">
                                    <input type="checkbox" id="removeImage" name="removeImage" value="true">
                                    <label for="removeImage">Bild entfernen</label>
                                </div>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="button primary">Speichern</button>
                            <a href="/admin/shop" class="button secondary">Abbrechen</a>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
