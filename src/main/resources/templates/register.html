<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrieren - Plan Prototyp Produktion</title>
</head>
<body>
    <div th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
        <main>
            <section class="login-form">
                <div class="container">
                    <h1>Konto erstellen</h1>
                    <form th:action="@{/register}" th:object="${registrationDto}" method="post" class="form-card">
                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                            <span th:each="err : ${#fields.globalErrors()}" th:text="${err}"></span>
                        </div>

                        <div class="form-group">
                            <label for="username">Benutzername</label>
                            <input type="text" id="username" th:field="*{username}" placeholder="Benutzername" required autofocus>
                            <span th:if="${#fields.hasErrors('username')}" class="field-error" th:errors="*{username}"></span>
                        </div>
                        <div class="form-group">
                            <label for="email">E-Mail-Adresse</label>
                            <input type="email" id="email" th:field="*{email}" placeholder="deine@email.de" required>
                            <span th:if="${#fields.hasErrors('email')}" class="field-error" th:errors="*{email}"></span>
                        </div>
                        <div class="form-group">
                            <label for="password">Passwort</label>
                            <input type="password" id="password" th:field="*{password}" placeholder="Mindestens 8 Zeichen" required>
                            <span th:if="${#fields.hasErrors('password')}" class="field-error" th:errors="*{password}"></span>
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword">Passwort bestätigen</label>
                            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" placeholder="Passwort wiederholen" required>
                            <span th:if="${#fields.hasErrors('confirmPassword')}" class="field-error" th:errors="*{confirmPassword}"></span>
                        </div>

                        <button type="submit" class="button primary">Konto erstellen</button>
                    </form>
                    <div class="auth-divider">
                        <span>Bereits registriert?</span>
                    </div>
                    <a href="/login" class="button secondary full-width">Zum Login</a>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
