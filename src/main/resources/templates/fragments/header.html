<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Header Fragment</title>
</head>
<body>
    <header th:fragment="header">
        <nav class="navbar">
            <div class="container">
                <a href="/" class="navbar-brand">Plan Prototyp Production</a>
                <ul class="navbar-nav">
                    <li class="nav-item" sec:authorize="!hasRole('ADMIN')" th:if="!${isAdminPath}"><a href="/blog" class="nav-link">Blog</a></li>
                    <li class="nav-item" sec:authorize="!hasRole('ADMIN')" th:if="!${isAdminPath}"><a href="/shop" class="nav-link">Shop</a></li>
                    <li class="nav-item" sec:authorize="!hasRole('ADMIN')" th:if="!${isAdminPath}"><a href="/newsletter" class="nav-link">Newsletter</a></li>
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'EDITOR')"><a href="/admin/blog" class="nav-link">CMS Admin</a></li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a href="/admin" class="nav-link">Admin Dashboard</a></li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a href="/admin/shop" class="nav-link">Shop Admin</a></li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a href="/admin/newsletter" class="nav-link">Newsletter Admin</a></li>
                    <li class="nav-item" sec:authorize="!hasRole('ADMIN')" th:if="!${isAdminPath}">
                        <a href="/shop/cart" class="nav-link">
                            🛒 Warenkorb
                            <span th:if="${cart != null && cart.totalItems > 0}" th:text="${cart.totalItems}" class="badge">0</span>
                            <span th:unless="${cart != null && cart.totalItems > 0}" class="badge">0</span>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <form th:action="@{/logout}" method="post" class="logout-form">
                            <button type="submit" class="nav-link logout-button">Logout</button>
                        </form>
                    </li>
                    <li class="nav-item" sec:authorize="!isAuthenticated()"><a href="/login" class="nav-link">Login</a></li>
                </ul>
            </div>
        </nav>
    </header>
</body>
</html>
