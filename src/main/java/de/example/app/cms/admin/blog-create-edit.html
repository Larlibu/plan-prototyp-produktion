<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${blogPostCreateDto != null ? 'Neuen Blog Post erstellen' : 'Blog Post bearbeiten'}"></title>
</head>
<body>
    <div th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
        <main>
            <section class="admin-form">
                <div class="container">
                    <h1 th:text="${blogPostCreateDto != null ? 'Neuen Blog Post erstellen' : 'Blog Post bearbeiten'}"></h1>

                    <form th:action="${blogPostCreateDto != null ? '/blog/admin/create' : '/blog/admin/edit/' + blogPostUpdateDto.id}"
                          th:object="${blogPostCreateDto != null ? blogPostCreateDto : blogPostUpdateDto}"
                          method="post" enctype="multipart/form-data" class="form-card">

                        <input type="hidden" th:if="${blogPostUpdateDto != null}" th:field="*{id}">

                        <div class="form-group">
                            <label for="title">Titel:</label>
                            <input type="text" id="title" th:field="*{title}" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                        </div>

                        <div class="form-group">
                            <label for="slug">Slug:</label>
                            <input type="text" id="slug" th:field="*{slug}" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}"></div>
                        </div>

                        <div class="form-group">
                            <label for="content">Inhalt:</label>
                            <textarea id="content" th:field="*{content}" th:errorclass="is-invalid" rows="10"></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
                        </div>

                        <div class="form-group">
                            <label for="imageFile">Bild:</label>
                            <input type="file" id="imageFile" name="imageFile" accept="image/*">
                            <div th:if="${blogPostUpdateDto != null and blogPostUpdateDto.existingImage != null}" class="current-image">
                                <p>Aktuelles Bild:</p>
                                <img th:src="@{'data:image/jpeg;base64,' + ${blogPostUpdateDto.existingImage}}" alt="Current Image" style="max-width: 200px; height: auto;">
                                <div class="form-check">
                                    <input type="checkbox" id="removeImage" name="removeImage" value="true">
                                    <label for="removeImage">Bild entfernen</label>
                                </div>
                            </div>
                        </div>

                        <div class="form-group" th:if="${blogPostUpdateDto != null}">
                            <input type="checkbox" id="published" th:field="*{published}">
                            <label for="published">Veröffentlicht</label>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="button primary">Speichern</button>
                            <a href="/blog/admin" class="button secondary">Abbrechen</a>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
